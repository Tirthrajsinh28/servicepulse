name: ServicePulse CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run unit and PostgreSQL integration tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Build container image
        run: docker build --tag servicepulse:${{ github.sha }} .

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: servicepulse-verification
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Run lint, type-check, tests, and production build
        run: npm run check

      - name: Audit high-severity frontend dependencies
        run: npm audit --audit-level=high

      - name: Build frontend container image
        working-directory: .
        run: docker build --tag servicepulse-web:${{ github.sha }} frontend

      - name: Upload frontend production bundle
        uses: actions/upload-artifact@v7
        with:
          name: servicepulse-frontend
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 14
